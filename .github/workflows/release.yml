# Runs ONLY when started manually or when a tag starting with "v" (e.g. v0.1.0)
# is pushed. Regular pushes, PRs and branches use no Actions minutes.
#
# Ways to cut a release:
#   - GitHub > Actions > Release APK > Run workflow (version: 0.1.0)
#   - git tag v0.1.0 && git push origin v0.1.0
#   - GitHub > Releases > Draft a new release (with a new v* tag)
# The workflow creates the tag/release if needed and attaches the signed APK.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   - the signing keystore, base64 encoded
#   RELEASE_KEYSTORE_PASSWORD - the keystore password
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      # Fail fast, before downloading anything, if the secrets are missing.
      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD secrets are missing."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got: $TAG)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # Version name comes from the tag: v1.2.3 -> 1.2.3
          NAME="${TAG#v}"
          flutter build apk --release --flavor prod \
            --target-platform android-arm64 \
            --build-name="$NAME" --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$NAME"
          cp build/app/outputs/flutter-apk/app-prod-release.apk "YASBA-$NAME.apk"

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "YASBA $TAG" --generate-notes
          fi
          gh release upload "$TAG" YASBA-*.apk --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
