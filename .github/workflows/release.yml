# SADECE elle başlatılınca ya da "v" ile başlayan bir etiket (ör. v0.1.0) gelince çalışır.
# Normal push'lar, PR'lar veya dallar Actions dakikası harcamaz. Geliştirme
# sırasındaki testler ve test APK'ları ("YAFA Dev") geliştirme ortamında derlenir.
#
# Release çıkarmanın yolları:
#   - GitHub > Actions > Release APK > Run workflow (sürüm: 0.1.0)
#   - git tag v0.1.0 && git push origin v0.1.0
#   - GitHub > Releases > Draft a new release (yeni v* etiketiyle)
# İş akışı etiket/Release yoksa oluşturur ve imzalı APK'yı ekler.
#
# Gerekli repo secret'ları (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   - imza anahtarı dosyasının base64 hali
#   RELEASE_KEYSTORE_PASSWORD - anahtar şifresi
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (ör. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      # Secret yoksa hiçbir şey indirmeden hemen dur (dakika harcamasın).
      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD secret'ları eksik."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Sürüm 1.2.3 biçiminde olmalı (gelen: $TAG)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # Sürüm adı etiketten alınır: v1.2.3 -> 1.2.3
          NAME="${TAG#v}"
          flutter build apk --release --flavor prod \
            --target-platform android-arm64 \
            --build-name="$NAME" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-prod-release.apk "YAFA-$NAME.apk"

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "YAFA $TAG" --generate-notes
          fi
          gh release upload "$TAG" YAFA-*.apk --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
