name: yasba
description: "YASBA (Yet Another Simple Budget App) - a simple, private, offline budget tracker."
publish_to: 'none'
version: 1.0.0+10000

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  path: ^1.9.1
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  generate: true
